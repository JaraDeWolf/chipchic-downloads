<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>ChipChic</title>
  <!-- Shown while the ChipChic website loads. The free server sleeps when nobody uses it and takes up to a minute to wake up. -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #1e1f22; color: #dbdee1; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
    main { text-align: center; max-width: 360px; padding: 24px; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { font-size: 20px; margin: 18px 0 6px; }
    p { color: #949ba4; font-size: 14px; line-height: 1.45; margin: 6px 0; }
    .dots span { display: inline-block; width: 8px; height: 8px; margin: 14px 3px 0; border-radius: 50%; background: #5865f2; animation: b 1.2s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: 0.15s; } .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes b { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    button { margin-top: 16px; background: #5865f2; color: #fff; border: 0; border-radius: 6px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    code { background: #2b2d31; padding: 1px 5px; border-radius: 4px; }
    .hide { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="icons/logo.png" alt="">
    <div id="loading">
      <h1>Connecting…</h1>
      <p>If the server has been asleep, this can take up to a minute.</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="failed" class="hide">
      <h1>Can’t reach ChipChic</h1>
      <p>Check your internet connection. Trying again by itself in <b id="secs">15</b> seconds.</p>
      <button id="retry">Try again</button>
    </div>
    <div id="nolink" class="hide">
      <h1>No website link yet</h1>
      <p>This copy of the app was built without your ChipChic link. Put it in <code>settings.json</code> and build the app again.</p>
    </div>
  </main>
  <script>
    const state = new URLSearchParams(location.search).get("state") || "loading";
    for (const id of ["loading", "failed", "nolink"]) document.getElementById(id).classList.toggle("hide", id !== state);
    const retry = () => window.chipchicDesktop && window.chipchicDesktop.retry();
    document.getElementById("retry").onclick = retry;
    if (state === "failed") {
      let left = 15;
      setInterval(() => { left--; document.getElementById("secs").textContent = Math.max(left, 0); if (left === 0) retry(); }, 1000);
    }
  </script>
</body>
</html>
